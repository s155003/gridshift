name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      # The dashboard re-implements the scheduler and the model evaluator in
      # JavaScript. Node is here so the parity tests can prove the two agree.
      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest ruff

      - name: Lint
        run: ruff check gridshift scripts tests

      - name: Test
        run: pytest tests -q

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install
        run: npm ci
        working-directory: web

      - name: Build
        run: npm run build
        working-directory: web

      # The bundle is useless without the trees, and a silent public/ copy
      # failure would ship a page that renders and then cannot forecast.
      - name: Check the model shipped with the bundle
        run: |
          test -f dist/model.json || { echo "model.json missing from build output"; exit 1; }
          node -e "
            const m = require('./dist/model.json');
            if (!m.trees?.length) { console.error('model.json has no trees'); process.exit(1); }
            console.log('model.json ok:', m.n_trees, 'trees,', m.features.length, 'features');
          "
        working-directory: web

      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist

  pages:
    needs: [test, build]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - id: deploy
        uses: actions/deploy-pages@v4

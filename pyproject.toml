[project]
name = "gridshift"
version = "0.1.0"
description = "Move flexible electricity demand to the cleanest hours of the grid."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "numpy>=1.26",
    "pandas>=2.1",
    "scikit-learn>=1.4",
    "requests>=2.31",
    "joblib>=1.3",
]

[project.optional-dependencies]
llm = ["anthropic>=0.40"]
charts = ["matplotlib>=3.8"]
dev = ["pytest>=8.0", "ruff>=0.6"]

[project.scripts]
gridshift = "gridshift.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["gridshift"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
# E501: long lines are allowed in the prose-heavy docstrings.
# B905: every zip() here pairs sequences that are equal length by construction.
ignore = ["E501", "B905"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::FutureWarning", "ignore::DeprecationWarning"]
